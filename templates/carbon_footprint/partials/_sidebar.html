<aside class="panel org">
  <h3>Datos de la organización</h3>
  <div class="org-fields">
    <div class="field">
      <label>Nombre de la organización</label>
      <input id="org-name" value="Universidad ECCI">
    </div>
    <div class="field">
      <label>NIT</label>
      <input id="org-nit" placeholder="Ej: 123456789">
    </div>
    <div class="field">
      <label>Sector económico</label>
      <input id="org-sector" placeholder="Ej: Educación">
    </div>
    <div class="field">
      <label>Responsable</label>
      <input id="org-name-resp" placeholder="Nombre">
    </div>
    <div class="field">
      <label>Año de cálculo</label>
      <input id="org-year" value="2022">
    </div>
  </div>

  <div class="org-block">
    <h4>Diligenciamiento de celdas y datos predeterminados</h4>
    <ul>
      <li>Los datos se registran mediante formularios y catálogos oficiales.</li>
      <li>Las tablas operativas funcionan como vista de referencia y exportación.</li>
      <li>El resultado oficial del inventario se ejecuta en la pestaña Huella.</li>
    </ul>
  </div>

</aside>
