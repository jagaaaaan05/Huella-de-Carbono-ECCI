name: Deploy to AWS

# Empaqueta Django para AWS Lambda (arm64), publica el código y aplica las migraciones.
# Cada entorno de GitHub (staging, prod) define estas variables:
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, LAMBDA_FUNCTION_NAME
# Sus valores salen de los outputs de Terraform.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno a desplegar
        type: choice
        options: [ staging, prod ]
        default: staging

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - run: pip install -r requirements.txt
    - run: python manage.py check
    - run: python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      FUNCTION: ${{ vars.LAMBDA_FUNCTION_NAME }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build Lambda package
      run: |
        pip install --target build --platform manylinux2014_aarch64 --implementation cp \
          --python-version 3.12 --only-binary=:all: -r requirements-lambda.txt
        cp -r manage.py ecci_carbon_footprint_dj carbon_footprint templates build/
        cd build
        DJANGO_DEBUG=False python manage.py collectstatic --noinput
        find . -name "__pycache__" -prune -exec rm -rf {} +
        zip -qr ../lambda.zip .

    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Publish code
      run: |
        aws lambda update-function-code --function-name "$FUNCTION" --zip-file fileb://lambda.zip > /dev/null
        aws lambda wait function-updated --function-name "$FUNCTION"

    - name: Run migrations
      run: |
        aws lambda invoke --function-name "$FUNCTION" --cli-binary-format raw-in-base64-out \
          --payload '{"manage": ["migrate", "--noinput"]}' out.json > /dev/null
        cat out.json
        python -c "import json, sys; sys.exit(0 if json.load(open('out.json')).get('ok') else 1)"
